  <title id="title">Joseph Sfeir</title>
  <desc id="desc">Software engineer from Zahle, Lebanon. Full-stack engineer at Simly. Building YallaHjoz, table bookings for Zahle. Building Jay, a private AI operator. Studying Computer &amp; Communications Engineering. The dot grid is my contribution calendar for the last 12 weeks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F7F2"/>
      <stop offset="1" stop-color="#E9ECE1"/>
    </linearGradient>
  </defs>
  <style>
    .name { font: 400 54px Georgia, 'Times New Roman', serif; fill: #191C1B; }
    .tagline { font: 400 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4A504A; }
    .caption { font: 400 10px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #6E756C; letter-spacing: 1px; }
    .line { font: 400 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #3B4731; opacity: 0; animation: line 16s infinite; }
    .dot { animation: settle 12s ease-in-out infinite both; }
    @keyframes line {
      0% { opacity: 0; transform: translateY(6px); }
      3.00%, 22.00% { opacity: 1; transform: translateY(0); }
      25.00%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    @keyframes settle {
      0%, 10% { transform: translate(var(--dx), var(--dy)); opacity: 0.35; }
      40%, 78% { transform: translate(0, 0); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)); opacity: 0.35; }
    }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
      .line { animation: none; }
      .line:first-of-type { opacity: 1; }
    }
  </style>
